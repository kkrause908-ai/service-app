<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service App — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+e2kQm0aZb8g+vY3j0q9Jm0bZr7EtQ1VYx3fQtmM0=" crossorigin=""/>
</head>
<body>
  <header class="topbar">
    <h1>Service App</h1>
    <nav class="menu">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/create.html">Utwórz zlecenie</a>
    </nav>
    <div>
      <span id="who"></span>
      <button id="logout">Wyloguj</button>
    </div>
  </header>
  <main class="container">
    <aside class="sidebar">
      <button id="refresh">Odśwież</button>
      <ul id="tasksList"></ul>
      <!-- Creation moved to separate page -->
    </aside>
    <section class="content">
      <div id="taskDetail">
        <h2 id="taskTitle">Wybierz zadanie</h2>
        <p id="taskMeta"></p>
        <p id="taskDesc"></p>
          <div class="taskTimes">
            <p>Rozpoczęcie: <span id="taskStart">-</span></p>
            <p>Zakończenie: <span id="taskEnd">-</span></p>
          </div>
          <div id="taskActions" class="taskActions">
            <button id="startBtn">Rozpocznij</button>
            <button id="finishBtn">Zakończ</button>
            <label class="field">Krótkie podsumowanie naprawy
              <textarea id="repairShort" rows="3"></textarea>
            </label>
            <div class="formActions"><button id="saveShort">Zapisz opis</button></div>
          </div>
        <div class="detailActions">
          <button id="openMap">Otwórz mapę</button>
          <button id="genPdf">Generuj PDF</button>
        </div>
        <div id="map" class="map"></div>
        <div class="photosArea">
          <h4>Zdjęcia</h4>
          <div id="photosList" class="photosList"></div>
          <div class="uploadControls">
            <input type="file" id="photoInput" accept="image/*">
            <button id="uploadPhoto">Wyślij zdjęcie</button>
          </div>
        </div>

        <div class="historyArea">
          <h4>Historia</h4>
          <ul id="history" class="historyList"></ul>
        </div>

        <div id="signatureModal" class="modal" style="display:none">
          <div class="modalContent">
            <h3>Podpisz</h3>
            <canvas id="signCanvas" width="600" height="200" style="border:1px solid #ccc"></canvas>
            <div class="modalActions">
              <button id="saveSign">Zapisz</button>
              <button id="clearSign">Wyczyść</button>
              <button id="cancelSign">Anuluj</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j8k8b4oXrKXkKp2Rk8s+7YjCqD1q0rDgQ1jvM5s=" crossorigin=""></script>
  <script src="/dashboard.js" defer></script>
</body>
</html>
