<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service App — Logowanie</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="auth">
    <h1>Zaloguj się</h1>
    <form id="loginForm">
      <label>Nazwa użytkownika
        <input type="text" name="username" required>
      </label>
      <label>Hasło
        <input type="password" name="password" required>
      </label>
      <div class="formActions"><button type="submit">Zaloguj</button></div>
    </form>
    <p id="msg" class="muted"></p>
    <p><a href="/index.html">Powrót do strony startowej</a> • <a href="/register.html">Utwórz konto</a></p>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
