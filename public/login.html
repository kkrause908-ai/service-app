<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service App</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-page { text-align: center; padding: 2rem; }
    .login-page h1 { font-size: 2.5rem; color: #2E3C8C; margin-bottom: 0.5rem; }
    .login-page p { color: #666; margin-bottom: 2rem; }
    .login-box { 
      background: #fff; 
      padding: 2rem; 
      border-radius: 8px; 
      box-shadow: 0 2px 20px rgba(0,0,0,0.1); 
      max-width: 350px;
      margin: 0 auto;
    }
    .login-box input { 
      width: 100%; padding: 0.75rem; margin-bottom: 1rem; 
      border: 1px solid #e5e5e5; border-radius: 4px; font-size: 1rem;
    }
    .login-box button { 
      width: 100%; padding: 0.75rem; 
      background: #2E3C8C; color: #fff; border: none; 
      border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .login-box button:hover { opacity: 0.9; }
    .links { margin-top: 1rem; }
    .links a { color: #2E3C8C; text-decoration: none; }
    .error { color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="login-page">
    <h1>Service App</h1>
    <p>Zarządzanie zleceniami serwisowymi</p>
    
    <div class="login-box">
      <p class="error" id="error"></p>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Login" required>
        <input type="password" name="password" placeholder="Hasło" required>
        <button type="submit">Zaloguj się</button>
      </form>
      <div class="links">
        <a href="/register.html">Utwórz konto</a>
      </div>
    </div>
  </div>

  <script src="/utils.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') })
      });
      
      const data = await res.json();
      
      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } else {
        const err = document.getElementById('error');
        err.textContent = data.error || 'Błąd logowania';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
