<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nowe zlecenie — Service App</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header class="topbar">
    <h1>Service App</h1>
    <nav class="menu">
      <a href="/dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
      <a href="/create.html"><i class="fa fa-plus"></i> Nowe zlecenie</a>
    </nav>
    <div>
      <span id="who"></span>
      <button id="logout">Wyloguj</button>
    </div>
  </header>

  <main style="padding: 2rem; max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;"><i class="fa fa-plus-circle"></i> Nowe zlecenie</h2>
    
    <div class="task-detail">
      <form id="createForm">
        <div class="form-group">
          <label>Tytuł *</label>
          <input name="title" required placeholder="Tytuł zlecenia">
        </div>
        
        <div class="form-group">
          <label>Przypisz do</label>
          <input name="assigned_to" list="usersList" placeholder="Technik">
          <datalist id="usersList"></datalist>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label>Status</label>
            <select name="status">
              <option value="utworzony">Utworzony</option>
              <option value="w trakcie">W trakcie</option>
              <option value="zakończony">Zakończony</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priorytet</label>
            <select name="priority">
              <option value="high">Wysoki</option>
              <option value="med" selected>Średni</option>
              <option value="low">Niski</option>
            </select>
          </div>
        </div>
        
        <div class="form-group">
          <label>Adres</label>
          <input name="address" placeholder="Adres zlecenia">
        </div>
        
        <div class="form-group">
          <label>Opis</label>
          <textarea name="description" rows="4" placeholder="Opis zlecenia..."></textarea>
        </div>
        
        <button type="submit" class="btn" style="width: 100%;">
          <i class="fa fa-plus"></i> Utwórz zlecenie
        </button>
      </form>
    </div>
  </main>

  <script src="/utils.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; }
    
    const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    
    fetch('/me', { headers }).then(r => r.json()).then(u => {
      document.getElementById('who').textContent = u.username;
    }).catch(() => window.location.href = '/login.html');
    
    fetch('/users', { headers }).then(r => r.json()).then(users => {
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        document.getElementById('usersList').appendChild(opt);
      });
    });
    
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });
    
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      
      const res = await fetch('/tasks', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          title: fd.get('title'),
          assigned_to: fd.get('assigned_to') || null,
          status: fd.get('status'),
          priority: fd.get('priority'),
          address: fd.get('address') || null,
          description: fd.get('description') || null
        })
      });
      
      if (res.ok) {
        Toast.success('Zlecenie utworzone!');
        e.target.reset();
        setTimeout(() => window.location.href = '/dashboard.html', 1000);
      } else {
        Toast.error('Błąd tworzenia zlecenia');
      }
    });
  </script>
</body>
</html>
