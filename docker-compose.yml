services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d service_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - .:/app   # mount local code into container so changes propagate without rebuild
      - /app/node_modules   # keep the image's node_modules directory (bind hides it otherwise)
    environment:
      DATABASE_URL: "postgresql://user:pass@postgres:5432/service_app?sslmode=disable"
      NODE_ENV: "production"
      JWT_SECRET: "supersecret_dev_change_me"
      # Optional: set ADMIN_PASSWORD to auto-create initial admin user
      ADMIN_PASSWORD: "admin123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
