version: '3.8'
services:
  db:
    image: postgres:15
    container_name: service_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: service_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d service_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: service_app_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/service_app
      JWT_SECRET: change_this_secret_in_production
      ADMIN_PASSWORD: admin
      DEFAULT_USER_PASSWORD: user123
      PORT: 3000
    ports:
      - "3000:3000"
    # no host volume for app to ensure node_modules from image are used
    command: ["bash","-lc","/wait-for-db.sh && npm run start"]
    env_file:
      - .env

  adminer:
    image: adminer
    container_name: service_app_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
