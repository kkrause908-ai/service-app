services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d service_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://user:pass@postgres:5432/service_app?sslmode=disable"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
